[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nbody"
version = "1.0.0"
description = "Structure-preserving numerical integration of the gravitational N-body problem"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Eren Can" }]
keywords = ["n-body", "gravitation", "symplectic integrators", "computational physics"]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
viewer = ["pygame>=2.1"]
experiments = ["scipy>=1.10"]
dev = ["pytest>=7.0", "scipy>=1.10", "pygame>=2.1"]

[project.scripts]
nbody = "nbody.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
